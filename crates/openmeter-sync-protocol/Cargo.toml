[package]
name = "openmeter-sync-protocol"
version = "0.1.0"
edition = "2021"

[dependencies]
base64 = "0.22"
chacha20poly1305 = "0.10"
hkdf = "0.12"
hmac = "0.12"
rand = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
zeroize = { version = "1", features = ["derive"] }
zstd = "0.13"

[dev-dependencies]
serde_json = "1"
