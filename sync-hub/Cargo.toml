[package]
name = "openmeter-sync-hub"
version = "0.1.0"
edition = "2021"

[dependencies]
axum = "0.8"
base64 = "0.22"
hmac = "0.12"
http-body-util = "0.1"
openmeter-sync-protocol = { path = "../crates/openmeter-sync-protocol" }
rand = "0.8"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "signal", "time"] }
tower-http = { version = "0.6", features = ["limit", "timeout"] }
windows-service = "0.8"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
