name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  rust:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            src-tauri
            crates/openmeter-sync-protocol
            sync-hub
      - name: Check maintained Rust formatting
        shell: pwsh
        run: |
          $formatFiles = @(
            (Get-ChildItem crates/openmeter-sync-protocol/src -Filter *.rs).FullName
            (Get-ChildItem sync-hub/src -Filter *.rs).FullName
            'crates/openmeter-sync-protocol/examples/tracking_fixture.rs'
            'src-tauri/src/accounts.rs'
            'src-tauri/src/cache.rs'
            'src-tauri/src/contracts.rs'
            'src-tauri/src/httpapi.rs'
            'src-tauri/src/platform.rs'
            'src-tauri/src/redaction.rs'
            'src-tauri/src/refresh.rs'
            'src-tauri/src/tracking_events.rs'
            'src-tauri/src/tracking_projection.rs'
            'src-tauri/src/sync_tracking.rs'
            'src-tauri/src/bin/openmeter.rs'
          )
          foreach ($file in $formatFiles) {
            rustfmt --edition 2021 --check --config skip_children=true $file
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - name: Check sync hub installer invariants
        shell: pwsh
        run: |
          .\scripts\test-sync-hub.ps1 -StaticOnly
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .\scripts\test-cross-device-sync.ps1 -StaticOnly
      - name: Check trusted release invariants
        shell: pwsh
        run: |
          .\scripts\test-release-workflow.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .\scripts\test-install-script.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Check OpenUsage parity matrix
        shell: pwsh
        run: .\scripts\test-parity-matrix.ps1
      - name: Run Clippy
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo clippy --manifest-path crates/openmeter-sync-protocol/Cargo.toml --all-targets -- -D warnings
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo clippy --manifest-path sync-hub/Cargo.toml --all-targets -- -D warnings
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Run Rust tests
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          cargo test --manifest-path src-tauri/Cargo.toml --all-targets
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --manifest-path crates/openmeter-sync-protocol/Cargo.toml --all-targets
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --manifest-path sync-hub/Cargo.toml --all-targets
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

  frontend:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test -- --run
      - run: npm run build

  machine-local-artifacts:
    if: github.ref == 'refs/heads/feature/full-windows-parity'
    needs: [rust, frontend]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Build unsigned Windows machine-local artifacts
        shell: pwsh
        run: |
          cargo build --manifest-path sync-hub/Cargo.toml --release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo build --manifest-path crates/openmeter-sync-protocol/Cargo.toml --example tracking_fixture --release --target-dir sync-hub/target
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npx tauri build --bundles nsis --no-sign --ci
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $artifactRoot = 'machine-local-artifacts'
          New-Item -ItemType Directory -Force -Path $artifactRoot | Out-Null
          Copy-Item sync-hub/target/release/openmeter-sync-hub.exe $artifactRoot/
          Copy-Item sync-hub/target/release/examples/tracking_fixture.exe $artifactRoot/
          Copy-Item src-tauri/target/release/openmeter-tray.exe $artifactRoot/
          Copy-Item src-tauri/target/release/openmeter.exe $artifactRoot/
          Copy-Item src-tauri/target/release/bundle/nsis/*.exe $artifactRoot/
          Get-ChildItem $artifactRoot -File | Get-FileHash -Algorithm SHA256 |
            ForEach-Object { "$($_.Hash)  $([IO.Path]::GetFileName($_.Path))" } |
            Set-Content -LiteralPath "$artifactRoot/SHA256SUMS.txt" -Encoding Ascii
      - uses: actions/upload-artifact@v4
        with:
          name: openmeter-windows-machine-local-${{ github.sha }}
          path: machine-local-artifacts/
          if-no-files-found: error
          retention-days: 1
